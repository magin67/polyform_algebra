[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyform_algebra"
version = "0.2.0"
description = "Algebra for polyforms and simplices"
requires-python = ">=3.8"
dependencies = ["numpy", "networkx"]

[tool.setuptools.packages.find]
# Using default package discovery (current directory)

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"